# Databricks asset bundle — Drought Index Pipeline
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: Drought-indices

sync:
  include:
    - "Codes/App/**"
    - "Codes/00. MASTER_RUN_databricks.Rmd"
    - "Codes/00_v2_MASTER_RUN_pandas_udf.ipynb"
    - "Codes/00_v2_MASTER_RUN_pandas_udf.py"
    - "Codes/01. SPI_Calculation.R"
    - "Codes/01_v2_SPI_pandas_udf.py"
    - "Codes/02a. SPEI_Calculation_Thornthwaite.R"
    - "Codes/02a_v2_SPEI_Thornthwaite_pandas_udf.py"
    - "Codes/02b. SPEI_Calculation_Penman.R"
    - "Codes/02b_v2_SPEI_Penman_pandas_udf.py"
    - "Codes/03_v2_Drought_Detection_pandas_udf.py"
    - "Codes/03. Drought_Detection.R"
    - "Codes/04. Sanity_Checks.R"
    - "Codes/05. Reference_Period_Params.R"
    - "Codes/06. Analysis1_Friedman.R"
    - "Codes/07. Analysis2_CrossPeriod.R"
    - "Codes/08. AppendixA1_Figure.R"
    - "Codes/09. CDD_SPI_Comparison.R"
    - "Codes/diag_udf_test.Rmd"
    - "Codes/diag_udf_inner.R"
    - "Codes/PET_data_prep/**"
    - "databricks.yml"
  exclude:
    - ".Rproj.user/**"
    - ".Rproj.user/"
    - "**/.Rproj.user/**"
    - "Drought Calculation*/**"
    - "*_files/**"
    - "**/*_files/**"
    - "typings/**"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-9c907c32-f434.cloud.databricks.com
      root_path: ~/Drought-indices
      profile: DEFAULT

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-9c907c32-f434.cloud.databricks.com

resources:
  jobs:
    drought_pipeline:
      name: "Drought Index Pipeline — Phase 1"
      tasks:
        - task_key: run_pipeline
          existing_cluster_id: 0123-211315-fp4hw1e8
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/00. MASTER_RUN_databricks
            source: WORKSPACE

    drought_udf_test:
      name: "spark_udf capability test"
      tasks:
        - task_key: run_udf_test
          existing_cluster_id: 0616-154127-izvo5r0w
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/diag_udf_test
            source: WORKSPACE

    drought_pipeline_v2:
      name: "Drought Index Pipeline — V2 Pandas UDF"
      tasks:
        - task_key: run_pipeline_v2
          existing_cluster_id: 0616-154127-izvo5r0w  # multi-node (drought-r-spark-apply)
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/00_v2_MASTER_RUN_pandas_udf
            source: WORKSPACE
          timeout_seconds: 86400

    drought_era5_monitor:
      name: "GWSC Drought ERA5 Monitor"
      tasks:
        - task_key: run_app
          existing_cluster_id: 0123-211315-fp4hw1e8
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/App/00_APP_MASTER
            source: WORKSPACE

