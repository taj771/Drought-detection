# Databricks asset bundle — Drought Index Pipeline
# See https://docs.databricks.com/dev-tools/bundles/index.html

bundle:
  name: Drought-indices

sync:
  # Only the live code is synced to the workspace. Reports, _archive, v1 (kept
  # in git for reference, not run), and large binaries stay local to keep the
  # bundle deploy small and fast.
  include:
    - "Codes/v2_pipeline/**"
    - "Codes/PET_data_prep/**"
    - "databricks.yml"
  exclude:
    - "**/.Rproj.user/**"
    - "Codes/_archive/**"
    - "Codes/reports/**"
    - "Codes/old/**"
    - "Drought Calculation*/**"
    - "*_files/**"
    - "**/*_files/**"
    - "typings/**"

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-9c907c32-f434.cloud.databricks.com
      root_path: ~/Drought-indices
      profile: DEFAULT

  ## Optionally, there could be 'staging' or 'prod' targets here.
  #
  # prod:
  #   workspace:
  #     host: https://dbc-9c907c32-f434.cloud.databricks.com

resources:
  jobs:
    # ARCHIVED 2026-09-16. Superseded by drought_pipeline_v2 — do not run.
    # v1 is the original pure-R single-cluster pipeline (scripts 00-03 only, no
    # 04-09). It is kept as an independent reference implementation: v2's Python
    # pandas_udf steps were ported from it, so it is the check to reach for if a
    # v2 number ever looks wrong. Code moved to Codes/_archive/v1_R_single_cluster/.
    #
    # The job definition is kept rather than deleted so its run history survives;
    # deleting it here would remove the job, and the history, on the next deploy.
    # It has no schedule, so it only runs if someone starts it by hand.
    drought_pipeline:
      name: "[ARCHIVED] Drought Index Pipeline — Phase 1 (v1, R single-cluster)"
      tasks:
        - task_key: run_pipeline
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/_archive/v1_R_single_cluster/00. MASTER_RUN_databricks
            source: WORKSPACE

    drought_pipeline_v2:
      name: "Drought Index Pipeline — V2 Pandas UDF"
      # Single-shot DAG: distributed Python index calc + detection (01/02a/02b→03),
      # then R stats/figures off all_drought_events.parquet (04,05,06,07,08,09).
      # 07 comparison period = ERA5 2003-2023 (NOT CMIP6) — split from the same
      # detection output, so it runs in Phase 1. 07 depends on 06 (avg ranks).
      # Python steps run via _run_py_step (exec); R steps via _run_r_step (source).
      # Branch new analyses by adding a task that depends_on detect_03.
      #
      # COUNTRY selects which country the whole run processes. Outputs go to
      # drought_outputs/v2/<COUNTRY>/, so runs for different countries never
      # collide. Override at launch:
      #   databricks bundle run drought_pipeline_v2 --target dev \
      #     --params COUNTRY=Niger
      # Both runners print "=== COUNTRY = ... ===" — check that line in the task
      # logs to confirm the parameter bound, since the scripts fall back to
      # Benin if it does not.
      #
      # STEPS selects which tasks do work. "all" (default) runs the whole DAG.
      # Otherwise a PIPE-separated list of task keys — pipe, not comma, because
      # --params is itself comma-separated. Unselected tasks exit in seconds;
      # the DAG shape is unchanged, so dependencies still resolve. Example, the
      # minimum set for a PET-formulation comparison:
      #   databricks bundle run drought_pipeline_v2 --target dev \
      #     --params COUNTRY=Eritrea,STEPS=spi_01|speit_02a|speip_02b|detect_03|sanity_04|params_05
      # Skipping a task whose downstream siblings still run means those siblings
      # read whatever outputs already exist on the Volume — check the task logs
      # for "=== SKIP ... ===" lines to confirm what actually ran.
      parameters:
        - name: COUNTRY
          default: Eritrea
        # Current run: Q6, does PET formulation matter in an arid climate.
        # Needs the three index treatments (SPI = no PET, SPEI-T = temperature
        # PET, SPEI-P = Penman PET), detection, the QC gate, and the frozen
        # reference-period params. friedman_06 / crossperiod_07 / appendix_08 /
        # cdd_09 answer other questions and are left out.
        # Set back to "all" (and COUNTRY back to Benin) for a full pipeline run.
        - name: STEPS
          default: spi_01|speit_02a|speip_02b|detect_03|sanity_04|params_05
      tasks:
        # -- Stage 1: index calculation (parallel) ----------------------------
        - task_key: spi_01
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_py_step
            source: WORKSPACE
            base_parameters: { STEP: "01_v2_SPI_pandas_udf.py", TASK: "spi_01" }
          timeout_seconds: 86400

        - task_key: speit_02a
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_py_step
            source: WORKSPACE
            base_parameters: { STEP: "02a_v2_SPEI_Thornthwaite_pandas_udf.py", TASK: "speit_02a" }
          timeout_seconds: 86400

        - task_key: speip_02b
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_py_step
            source: WORKSPACE
            base_parameters: { STEP: "02b_v2_SPEI_Penman_pandas_udf.py", TASK: "speip_02b" }
          timeout_seconds: 86400

        # -- Stage 2: detection (joins all 3 indices) -------------------------
        - task_key: detect_03
          depends_on:
            - task_key: spi_01
            - task_key: speit_02a
            - task_key: speip_02b
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_py_step
            source: WORKSPACE
            base_parameters: { STEP: "03_v2_Drought_Detection_pandas_udf.py", TASK: "detect_03" }
          timeout_seconds: 86400

        # -- Stage 3: stats + figures off detection output (parallel) ---------
        - task_key: sanity_04
          depends_on: [{ task_key: detect_03 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_r_step
            source: WORKSPACE
            base_parameters: { STEP: "04. Sanity_Checks.R", TASK: "sanity_04" }
          timeout_seconds: 86400

        - task_key: params_05
          depends_on: [{ task_key: detect_03 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_py_step
            source: WORKSPACE
            base_parameters: { STEP: "05_v2_Reference_Period_Params_pandas_udf.py", TASK: "params_05" }
          timeout_seconds: 86400

        - task_key: friedman_06
          depends_on: [{ task_key: detect_03 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_r_step
            source: WORKSPACE
            base_parameters: { STEP: "06. Analysis1_Friedman.R", TASK: "friedman_06" }
          timeout_seconds: 86400

        - task_key: crossperiod_07
          depends_on: [{ task_key: friedman_06 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_r_step
            source: WORKSPACE
            base_parameters: { STEP: "07. Analysis2_CrossPeriod.R", TASK: "crossperiod_07" }
          timeout_seconds: 86400

        - task_key: appendix_08
          depends_on: [{ task_key: detect_03 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_r_step
            source: WORKSPACE
            base_parameters: { STEP: "08. AppendixA1_Figure.R", TASK: "appendix_08" }
          timeout_seconds: 86400

        - task_key: cdd_09
          depends_on: [{ task_key: detect_03 }]
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/v2_pipeline/runners/_run_r_step
            source: WORKSPACE
            base_parameters: { STEP: "09. CDD_SPI_Comparison.R", TASK: "cdd_09" }
          timeout_seconds: 86400

    # ARCHIVED 2026-09-16. Superseded by the operational branch, which trims v2
    # rather than reimplementing it — do not run.
    #
    # app_monitor was a standalone R reimplementation of the index + detection
    # chain. It read the same ERA5 source as v2 (era5_daily_nn), but computed
    # indices with a different engine (R SPEI package, not Python
    # climate-indices) and had drifted behind v2 on two fixes that change
    # results:
    #   - PET: it reads ERA5-Land pet_clipped/*.nc. That is the broken PET
    #     (pan-evaporation plus a unit error) which v2 replaced with CRU TS 4.08
    #     Penman, so its SPEI-P is wrong.
    #   - Clipping: it filters pixels by bounding box only, never applying the
    #     country polygon it loads. That is the bug fixed in v2 script 01, and
    #     it admits ocean and neighbouring-country pixels (for Benin, roughly
    #     double the true count).
    # Anything produced by this job carries both. Code moved to
    # Codes/_archive/app_monitor/ and dropped from the sync list, so it no
    # longer deploys to the workspace.
    #
    # The job definition is kept, unscheduled, so its run history survives.
    drought_era5_monitor:
      name: "[ARCHIVED] GWSC Drought ERA5 Monitor"
      tasks:
        - task_key: run_app
          existing_cluster_id: 0826-162532-rizow5jl
          notebook_task:
            notebook_path: /Workspace/Users/tajayalath@ua.edu/Drought-indices/files/Codes/_archive/app_monitor/00_APP_MASTER
            source: WORKSPACE

